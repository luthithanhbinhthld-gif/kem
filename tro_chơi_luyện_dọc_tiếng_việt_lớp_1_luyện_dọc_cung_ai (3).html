<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Luyện đọc Tiếng Việt 1 - Nhận xét phát âm</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f0f9ff;margin:0;padding:20px;color:#0f172a}
    .container{max-width:800px;margin:auto;background:#fff;border-radius:10px;padding:20px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
    h1{font-size:1.4rem;text-align:center;color:#0369a1}
    .sentence{font-size:1.3rem;margin:20px 0;text-align:center}
    .word{display:inline-block;margin:3px;padding:4px 6px;border-radius:6px;background:#f1f5f9}
    .wrong{color:#dc2626;font-weight:bold}
    .controls{text-align:center;margin-top:15px}
    button{background:#0ea5e9;color:white;border:none;padding:10px 15px;margin:4px;border-radius:8px;cursor:pointer;font-size:1rem}
    button:disabled{opacity:0.6;cursor:not-allowed}
    audio{width:100%;margin-top:15px}
    .result{margin-top:20px;padding:10px;border-radius:8px;background:#f8fafc;font-size:1rem;text-align:center}
  </style>
</head>
<body>
  <div class="container">
    <h1>Luyện đọc Tiếng Việt 1 – Nhận xét phát âm</h1>
    <div id="sentence" class="sentence">Bé đi học mỗi ngày.</div>
    <div class="controls">
      <button id="newSentence">Câu mới</button>
      <button id="startRec">Bắt đầu ghi âm</button>
      <button id="stopRec" disabled>Dừng ghi âm</button>
      <button id="startASR">Kiểm tra phát âm</button>
    </div>
    <audio id="audio" controls></audio>
    <div id="result" class="result">Chưa có nhận xét.</div>
  </div>

<script>
const SENTENCES = [
  'Mẹ nấu cơm ngon.',
  'Bé đi học mỗi ngày.',
  'Trời nắng hôm nay.',
  'Con chó chạy nhanh.',
  'Cây xanh sau nhà.',
  'Em ăn một quả táo.',
  'Nam và An chơi đá banh.',
  'Bé hát một bài.'
];

const sentenceEl = document.getElementById('sentence');
const resultEl = document.getElementById('result');
const newSentenceBtn = document.getElementById('newSentence');
const startRecBtn = document.getElementById('startRec');
const stopRecBtn = document.getElementById('stopRec');
const startASRBtn = document.getElementById('startASR');
const audioEl = document.getElementById('audio');

let currentSentence = sentenceEl.textContent;
let mediaRecorder, audioChunks = [], recognition;

newSentenceBtn.onclick = ()=>{
  currentSentence = SENTENCES[Math.floor(Math.random()*SENTENCES.length)];
  sentenceEl.textContent = currentSentence;
  resultEl.textContent = 'Hãy đọc câu trên thật to!';
  resultEl.style.color = '#0f172a';
};

startRecBtn.onclick = async ()=>{
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const url = URL.createObjectURL(blob);
      audioEl.src = url;
    };
    mediaRecorder.start();
    startRecBtn.disabled = true;
    stopRecBtn.disabled = false;
    resultEl.textContent = 'Đang ghi âm...';
    resultEl.style.color = '#0369a1';
  } catch (err) {
    resultEl.textContent = 'Không thể truy cập micro. Hãy kiểm tra quyền!';
    resultEl.style.color = '#dc2626';
  }
};

stopRecBtn.onclick = ()=>{
  mediaRecorder.stop();
  startRecBtn.disabled = false;
  stopRecBtn.disabled = true;
  resultEl.textContent = 'Đã ghi âm xong! Bấm “Kiểm tra phát âm”.';
  resultEl.style.color = '#0f172a';
};

startASRBtn.onclick = ()=>{
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    resultEl.textContent = 'Trình duyệt không hỗ trợ nhận diện giọng nói.';
    resultEl.style.color = '#dc2626';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.lang = 'vi-VN';
  recognition.onresult = e => {
    const text = e.results[0][0].transcript;
    showComparison(text, currentSentence);
  };
  recognition.onerror = ()=>{
    resultEl.textContent = 'Không thể nhận diện giọng nói. Hãy thử lại!';
    resultEl.style.color = '#dc2626';
  };
  recognition.start();
  resultEl.textContent = 'Đang nghe và nhận diện...';
  resultEl.style.color = '#0369a1';
};

function normalize(t){
  return t.toLowerCase().replace(/[^a-z0-9áàạảãâấầậẩẫăắằặẳẵéèẹẻẽêếềệểễíìịỉĩóòọỏõôốồộổỗơớờợởỡúùụủũưứừựửữýỳỵỷỹđ\s]/gi,'').trim();
}
function showComparison(spoken, target){
  const spokenArr = normalize(spoken).split(/\s+/);
  const targetArr = normalize(target).split(/\s+/);
  let html=''; let wrongCount=0;
  for(let i=0;i<targetArr.length;i++){
    const t = targetArr[i] || '';
    const s = spokenArr[i] || '';
    if(t===s) html += `<span class="word">${t}</span>`;
    else { html += `<span class="word wrong">${t}</span>`; wrongCount++; }
  }
  sentenceEl.innerHTML = html;
  if(wrongCount===0){ resultEl.textContent = 'Tốt lắm! Bạn đọc chính xác toàn bộ câu.'; resultEl.style.color = '#16a34a'; }
  else { resultEl.textContent = `Bạn đọc sai ${wrongCount} từ. Những từ sai có màu đỏ.`; resultEl.style.color = '#dc2626'; }
}
</script>
</body>
</html>
